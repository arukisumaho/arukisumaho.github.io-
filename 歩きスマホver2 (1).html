<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>歩きスマホ防止見守り</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #212529;
            --status-bg: #e9ecef;
            --status-color: #495057;
            --primary-color: #0d6efd;
            --danger-bg: #fff5f5;
            --danger-color: #e03131;
        }

        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s ease;
        }

        body.is-danger {
            background-color: var(--danger-bg);
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem 1.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .shield-icon {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
        }

        h1 {
            font-size: 1.2rem;
            margin: 0 0 0.5rem 0;
            font-weight: 700;
        }

        p.desc {
            font-size: 0.85rem;
            color: #6c757d;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .status-badge {
            background-color: var(--status-bg);
            color: var(--status-color);
            padding: 0.75rem 1.25rem;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .status-badge.active { background-color: #e7f5ff; color: #1c7ed6; }
        .status-badge.danger { background-color: #ffe3e3; color: var(--danger-color); }

        .btn {
            width: 100%;
            padding: 1rem;
            font-size: 1rem;
            font-weight: 700;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.25);
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn.stop {
            background-color: #6c757d;
            box-shadow: none;
        }

        /* 誤操作を防ぐロックモード用 */
        .lock-notice {
            margin-top: 1rem;
            font-size: 0.75rem;
            color: #adb5bd;
        }

        /* カメラと画面処理用キャンバスはバックグラウンド非表示 */
        #video, #canvas { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="shield-icon" id="icon">🛡️</div>
        <h1>歩行安全モニタリング</h1>
        <p class="desc">移動中の画面操作や歩行を検知し<br>安全な歩行をサポートします</p>

        <div id="status" class="status-badge">保護システム停止中</div>

        <button id="toggleBtn" class="btn" onclick="toggleDetection()">保護を開始する</button>
        
        <div class="lock-notice" id="lockNotice">※開始後は画面を開いたままお持ちください</div>
    </div>

    <!-- リアカメラを指定（スマホ向き） -->
    <video id="video" width="320" height="240" autoplay playsinline></video>
    <canvas id="canvas" width="320" height="240"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');
        const toggleBtn = document.getElementById('toggleBtn');
        const iconDiv = document.getElementById('icon');

        let audioCtx = null;
        let lastFrameData = null;
        let isRunning = false;
        let intervalId = null;

        function playAlarm() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let osc = audioCtx.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime); 
            osc.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        async function toggleDetection() {
            if (!isRunning) {
                try {
                    // スマホのリアカメラ（背面）を優先取得
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: { exact: "environment" } }, 
                        audio: false 
                    }).catch(() => {
                        // リアカメラが取得できない場合は通常のカメラにフォールバック
                        return navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    });

                    video.srcObject = stream;
                    isRunning = true;
                    
                    toggleBtn.innerText = "保護を一時停止";
                    toggleBtn.classList.add('stop');
                    statusDiv.innerText = "安全状態を監視中";
                    statusDiv.className = "status-badge active";
                    iconDiv.innerText = "🔒";
                    
                    // 200msごとに振動・差分をチェック
                    intervalId = setInterval(checkMovement, 200);
                } catch (err) {
                    alert("カメラの起動に失敗しました。アクセス許可を確認してください。");
                    console.error(err);
                }
            } else {
                // 停止処理
                isRunning = false;
                clearInterval(intervalId);
                if (video.srcObject) {
                    video.srcObject.getTracks().forEach(track => track.stop());
                }
                toggleBtn.innerText = "保護を開始する";
                toggleBtn.classList.remove('stop');
                statusDiv.innerText = "保護システム停止中";
                statusDiv.className = "status-badge";
                document.body.classList.remove('is-danger');
                iconDiv.innerText = "🛡️";
            }
        }

        function checkMovement() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const currentFrame = ctx.getImageData(0, 0, canvas.width, canvas.height);
                
                if (lastFrameData) {
                    let diff = 0;
                    for (let i = 0; i < currentFrame.data.length; i += 4) {
                        diff += Math.abs(currentFrame.data[i] - lastFrameData.data[i]);
                    }
                    
                    // スマホの揺れ判定基準値（必要に応じて微調整）
                    if (diff > 1200000) { 
                        statusDiv.innerText = "⚠️ 歩行を検知しました";
                        statusDiv.className = "status-badge danger";
                        document.body.classList.add('is-danger');
                        iconDiv.innerText = "🚨";
                        playAlarm();
                    } else {
                        statusDiv.innerText = "安全状態（静止中）";
                        statusDiv.className = "status-badge active";
                        document.body.classList.remove('is-danger');
                        iconDiv.innerText = "🔒";
                    }
                }
                lastFrameData = currentFrame;
            }
        }
    </script>
</body>
</html>
