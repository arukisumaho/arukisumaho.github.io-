<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歩きスマホ自動検知システム - CYBER OS</title>
  
  <!-- MediaPipe (顔・姿勢認識) のライブラリを読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Share Tech Mono', 'Consolas', monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
      color: #0f172a;
      transition: all 0.3s ease;
      background-color: #f1f5f9;
      /* 高精細なサイバーグリッド背景 */
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.1) 0%, transparent 60%),
        linear-gradient(rgba(14, 165, 233, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(14, 165, 233, 0.1) 1px, transparent 1px);
      background-size: 100% 100%, 20px 20px, 20px 20px;
      overflow: hidden;
      position: relative;
    }

    /* 走査線（スキャンライン）アニメーション */
    body::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.03) 50%);
      background-size: 100% 4px;
      z-index: 100;
      pointer-events: none;
    }

    /* 危険時の背景赤点滅 */
    body.danger {
      background-color: #ef4444 !important;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.2) 0%, transparent 70%),
        linear-gradient(rgba(255, 255, 255, 0.2) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.2) 1px, transparent 1px) !important;
      animation: pulse-bg 0.4s infinite alternate;
    }
    @keyframes pulse-bg {
      0% { background-color: #ef4444; }
      100% { background-color: #7f1d1d; }
    }

    header {
      padding: 16px;
      text-align: center;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 2px solid #0284c7;
      box-shadow: 0 4px 20px rgba(2, 132, 199, 0.2);
      position: relative;
      z-index: 10;
    }
    h1 { 
      font-size: 1.1rem; 
      letter-spacing: 0.15em;
      color: #0f172a;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    h1::before {
      content: '●';
      color: #0ea5e9;
      font-size: 0.8rem;
      animation: blink 1s infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      gap: 20px;
      text-align: center;
      z-index: 10;
    }

    /* ビデオ表示部：サイバーホログラム風 */
    .video-container {
      position: relative;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      padding: 6px;
      background: linear-gradient(135deg, #0ea5e9, #38bdf8, transparent);
      box-shadow: 0 0 25px rgba(14, 165, 233, 0.4);
    }
    .video-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      background: #090d16;
      position: relative;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    /* ステータスカード：カットオフ角デザイン */
    #status-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      padding: 20px 24px;
      width: 100%;
      max-width: 340px;
      border: 1px solid #38bdf8;
      /* 角斜めカット（SFパーツ風） */
      clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08), 0 0 15px rgba(56, 189, 248, 0.2);
      position: relative;
      transition: all 0.3s;
    }
    body.danger #status-card {
      background: rgba(15, 23, 42, 0.95);
      border-color: #f87171;
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.6);
    }

    #status-title { 
      font-size: 1.3rem; 
      font-weight: bold; 
      margin-bottom: 8px; 
      color: #0f172a; 
      letter-spacing: 0.05em;
    }
    body.danger #status-title { color: #fca5a5; }

    #status-detail { font-size: 0.85rem; color: #475569; font-weight: 500; }
    body.danger #status-detail { color: #fecdd3; }

    /* 操作エリア */
    footer {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      padding: 24px 20px;
      border-top: 2px solid #0284c7;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 -10px 30px rgba(2, 132, 199, 0.1);
      z-index: 10;
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      font-size: 0.8rem;
      color: #334155;
    }
    .slider-group label { 
      display: flex; 
      justify-content: space-between; 
      width: 100%; 
      font-weight: bold;
      letter-spacing: 0.05em;
    }
    
    input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #e2e8f0;
      outline: none;
      accent-color: #0284c7;
    }

    /* サイバーネオンボタン */
    button {
      padding: 16px;
      border: 1px solid #38bdf8;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: white;
      font-family: inherit;
      font-weight: bold;
      font-size: 1rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
      box-shadow: 0 0 15px rgba(2, 132, 199, 0.4);
      transition: all 0.2s ease;
    }
    button:hover {
      background: linear-gradient(135deg, #0369a1 0%, #0284c7 100%);
      box-shadow: 0 0 25px rgba(14, 165, 233, 0.7);
      transform: translateY(-1px);
    }
    button:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>

  <header>
    <h1>Anti-Cell Phone Walking App / AI MONITOR</h1>
  </header>

  <main>
    <div class="video-container">
      <div class="video-inner">
        <video id="webcam" playsinline muted></video>
      </div>
    </div>

    <div id="status-card">
      <div id="status-title">STANDBY / 安全</div>
      <div id="status-detail">システムを開始してください</div>
    </div>
  </main>

  <footer>
    <button id="start-btn">▶ START SYSTEM</button>

    <div class="slider-group">
      <label>
        <span>SENSITIVITY (顔下向き感度):</span>
        <span id="cam-val">0.05</span>
      </label>
      <input type="range" id="cam-threshold" min="0.01" max="0.15" step="0.01" value="0.05">
    </div>

    <div class="slider-group">
      <label>
        <span>MOTION SENSOR (歩行揺れ):</span>
        <span id="motion-val">3.0</span>
      </label>
      <input type="range" id="motion-threshold" min="1.0" max="10.0" step="0.5" value="3.0">
    </div>
  </footer>

  <script>
    let isLookingDown = false;
    let isWalking = false;
    let audioCtx = null;
    let lastAccel = { y: 0, z: 0 };
    let lastWalkingTime = 0;

    const body = document.body;
    const video = document.getElementById('webcam');
    const statusTitle = document.getElementById('status-title');
    const statusDetail = document.getElementById('status-detail');
    const startBtn = document.getElementById('start-btn');

    const camThresholdInput = document.getElementById('cam-threshold');
    const motionThresholdInput = document.getElementById('motion-threshold');
    const camValDisplay = document.getElementById('cam-val');
    const motionValDisplay = document.getElementById('motion-val');

    camThresholdInput.addEventListener('input', (e) => camValDisplay.textContent = e.target.value);
    motionThresholdInput.addEventListener('input', (e) => motionValDisplay.textContent = e.target.value);

    // --- 1. アプリ起動処理 ---
    startBtn.addEventListener('click', async () => {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      // AIカメラ（MediaPipe FaceMesh）の初期化
      initFaceMesh();

      // Motion Sensor（加速度センサー）の設定
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        const permission = await DeviceMotionEvent.requestPermission();
        if (permission === 'granted') {
          window.addEventListener('devicemotion', handleMotion);
        }
      } else {
        window.addEventListener('devicemotion', handleMotion);
      }

      startBtn.style.display = 'none';
    });

    // --- 2. MediaPipe Face Mesh（顔認識AI）による下向き判定 ---
    function initFaceMesh() {
      const faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
      });

      faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      faceMesh.onResults(onFaceResults);

      const camera = new Camera(video, {
        onFrame: async () => {
          await faceMesh.send({ image: video });
        },
        width: 320,
        height: 240
      });
      camera.start();
    }

    // 顔特徴点の解析処理
    function onFaceResults(results) {
      if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
        isLookingDown = false;
        updateState();
        return;
      }

      const landmarks = results.multiFaceLandmarks[0];
      
      // 鼻先（1番）と顎（152番）のY座標から「顔が下を向いているか」を計算
      const noseY = landmarks[1].y;
      const chinY = landmarks[152].y;
      const faceDiff = chinY - noseY;

      const threshold = parseFloat(camThresholdInput.value);
      
      // 顎と鼻の位置関係が近づく（俯く）と閾値以下になり下向きと判定
      isLookingDown = faceDiff < (0.25 - threshold);
      updateState();
    }

    // --- 3. 加速度センサー処理（余韻タイマー） ---
    function handleMotion(event) {
      const accel = event.accelerationIncludingGravity;
      if (!accel) return;

      const deltaY = Math.abs(accel.y - lastAccel.y);
      const deltaZ = Math.abs(accel.z - lastAccel.z);
      lastAccel = { y: accel.y, z: accel.z };

      const totalDelta = deltaY + deltaZ;
      const threshold = parseFloat(motionThresholdInput.value);
      const now = Date.now();

      if (totalDelta > threshold) {
        lastWalkingTime = now;
      }

      const delayTime = 2000; // 2秒間の歩行検知の余韻
      isWalking = (now - lastWalkingTime) < delayTime;

      updateState();
    }

    // --- 4. 判定と警告機能 ---
    function updateState() {
      if (isLookingDown && isWalking) {
        body.className = 'danger';
        statusTitle.textContent = '⚠DANGER / 歩きスマホ⚠';
        statusDetail.textContent = '顔が下を向いた状態で移動しています！';

        playAlertSound();
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      } else {
        body.className = '';
        statusTitle.textContent = 'SAFE / 安全';
        
        if (isWalking && !isLookingDown) {
          statusDetail.textContent = '前を向いて歩いています';
        } else if (!isWalking && isLookingDown) {
          statusDetail.textContent = '立ち止まって操作しています';
        } else {
          statusDetail.textContent = '周囲の安全が確保されています';
        }
      }
    }

    let lastSoundTime = 0;
    function playAlertSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      if (now - lastSoundTime < 0.5) return;
      lastSoundTime = now;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(880, now);
      gain.gain.setValueAtTime(0.1, now);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.3);
    }
  </script>
</body>
</html>
