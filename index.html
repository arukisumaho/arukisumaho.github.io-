<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歩きスマホ自動検知システム</title>
  
  <!-- MediaPipe (顔・姿勢認識) のライブラリを読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      color: #fff;
      transition: background-color 0.3s ease;
      background-color: #059669; /* 初期状態：緑（安全） */
      overflow: hidden;
    }

    /* 危険時の背景赤点滅 */
    body.danger {
      background-color: #dc2626 !important;
      animation: pulse-bg 0.5s infinite alternate;
    }
    @keyframes pulse-bg {
      0% { background-color: #dc2626; }
      100% { background-color: #7f1d1d; }
    }

    header {
      padding: 16px;
      text-align: center;
      background: rgba(0, 0, 0, 0.2);
    }
    h1 { font-size: 1.2rem; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      gap: 16px;
      text-align: center;
    }

    #status-card {
      background: rgba(0, 0, 0, 0.4);
      padding: 16px 24px;
      border-radius: 12px;
      width: 100%;
      max-width: 320px;
    }
    #status-title { font-size: 1.5rem; font-weight: bold; margin-bottom: 8px; }
    #status-detail { font-size: 0.9rem; opacity: 0.9; }

    .video-container {
      position: relative;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid rgba(255, 255, 255, 0.5);
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* 鏡像表示 */
    }

    footer {
      background: rgba(0, 0, 0, 0.6);
      padding: 20px;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .slider-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      font-size: 0.85rem;
    }
    .slider-group label { display: flex; justify-content: space-between; width: 100%; }
    input[type="range"] { width: 100%; }

    button {
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: white;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>歩きスマホ自動検知システム (MediaPipe版)</h1>
  </header>

  <main>
    <div class="video-container">
      <video id="webcam" playsinline muted></video>
    </div>

    <div id="status-card">
      <div id="status-title">🌱 安全な状態です</div>
      <div id="status-detail">ボタンを押して監視を開始してください</div>
    </div>
  </main>

  <footer>
    <button id="start-btn">センサー・AIカメラを開始</button>

    <div class="slider-group">
      <label>
        <span>顔の下向き感度閾値:</span>
        <span id="cam-val">0.05</span>
      </label>
      <input type="range" id="cam-threshold" min="0.01" max="0.15" step="0.01" value="0.05">
    </div>

    <div class="slider-group">
      <label>
        <span>加速度センサー閾値（歩行揺れ）:</span>
        <span id="motion-val">3.0</span>
      </label>
      <input type="range" id="motion-threshold" min="1.0" max="10.0" step="0.5" value="3.0">
    </div>
  </footer>

  <script>
    let isLookingDown = false;
    let isWalking = false;
    let audioCtx = null;
    let lastAccel = { y: 0, z: 0 };
    let lastWalkingTime = 0;

    const body = document.body;
    const video = document.getElementById('webcam');
    const statusTitle = document.getElementById('status-title');
    const statusDetail = document.getElementById('status-detail');
    const startBtn = document.getElementById('start-btn');

    const camThresholdInput = document.getElementById('cam-threshold');
    const motionThresholdInput = document.getElementById('motion-threshold');
    const camValDisplay = document.getElementById('cam-val');
    const motionValDisplay = document.getElementById('motion-val');

    camThresholdInput.addEventListener('input', (e) => camValDisplay.textContent = e.target.value);
    motionThresholdInput.addEventListener('input', (e) => motionValDisplay.textContent = e.target.value);

    // --- 1. アプリ起動処理 ---
    startBtn.addEventListener('click', async () => {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      // AIカメラ（MediaPipe FaceMesh）の初期化
      initFaceMesh();

      // Motion Sensor（加速度センサー）の設定
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        const permission = await DeviceMotionEvent.requestPermission();
        if (permission === 'granted') {
          window.addEventListener('devicemotion', handleMotion);
        }
      } else {
        window.addEventListener('devicemotion', handleMotion);
      }

      startBtn.style.display = 'none';
    });

    // --- 2. MediaPipe Face Mesh（顔認識AI）による下向き判定 ---
    function initFaceMesh() {
      const faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
      });

      faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      faceMesh.onResults(onFaceResults);

      const camera = new Camera(video, {
        onFrame: async () => {
          await faceMesh.send({ image: video });
        },
        width: 320,
        height: 240
      });
      camera.start();
    }

    // 顔特徴点の解析処理
    function onFaceResults(results) {
      if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) {
        isLookingDown = false;
        updateState();
        return;
      }

      const landmarks = results.multiFaceLandmarks[0];
      
      // 鼻先（1番）と顎（152番）のY座標から「顔が下を向いているか」を計算
      const noseY = landmarks[1].y;
      const chinY = landmarks[152].y;
      const faceDiff = chinY - noseY;

      const threshold = parseFloat(camThresholdInput.value);
      
      // 顎と鼻の位置関係が近づく（俯く）と閾値以下になり下向きと判定
      isLookingDown = faceDiff < (0.25 - threshold);
      updateState();
    }

    // --- 3. 加速度センサー処理（余韻タイマー） ---
    function handleMotion(event) {
      const accel = event.accelerationIncludingGravity;
      if (!accel) return;

      const deltaY = Math.abs(accel.y - lastAccel.y);
      const deltaZ = Math.abs(accel.z - lastAccel.z);
      lastAccel = { y: accel.y, z: accel.z };

      const totalDelta = deltaY + deltaZ;
      const threshold = parseFloat(motionThresholdInput.value);
      const now = Date.now();

      if (totalDelta > threshold) {
        lastWalkingTime = now;
      }

      const delayTime = 2000; // 2秒間の歩行検知の余韻
      isWalking = (now - lastWalkingTime) < delayTime;

      updateState();
    }

    // --- 4. 判定と警告機能 ---
    function updateState() {
      if (isLookingDown && isWalking) {
        body.className = 'danger';
        statusTitle.textContent = '⚠️ 危険！歩きスマホです！';
        statusDetail.textContent = '顔が下を向いた状態で移動しています！';

        playAlertSound();
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      } else {
        body.className = '';
        statusTitle.textContent = '🌱 安全な状態です';
        
        if (isWalking && !isLookingDown) {
          statusDetail.textContent = '前を向いて歩いています';
        } else if (!isWalking && isLookingDown) {
          statusDetail.textContent = '立ち止まって操作しています';
        } else {
          statusDetail.textContent = '周囲の安全が確保されています';
        }
      }
    }

    let lastSoundTime = 0;
    function playAlertSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      if (now - lastSoundTime < 0.5) return;
      lastSoundTime = now;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(880, now);
      gain.gain.setValueAtTime(0.1, now);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.3);
    }
  </script>
</body>
</html>
