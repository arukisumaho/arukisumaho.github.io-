<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歩きスマホ防止検知アプリ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      color: #fff;
      transition: background-color 0.3s ease;
      background-color: #059669; /* 初期状態：緑（安全） */
      overflow: hidden;
    }

    /* 危険時の背景赤点滅 */
    body.danger {
      background-color: #dc2626 !important;
      animation: pulse-bg 0.5s infinite alternate;
    }
    @keyframes pulse-bg {
      0% { background-color: #dc2626; }
      100% { background-color: #7f1d1d; }
    }

    header {
      padding: 16px;
      text-align: center;
      background: rgba(0, 0, 0, 0.2);
    }
    h1 { font-size: 1.2rem; }

    /* メインコンテナ */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      gap: 16px;
      text-align: center;
    }

    /* ステータス表示 */
    #status-card {
      background: rgba(0, 0, 0, 0.4);
      padding: 16px 24px;
      border-radius: 12px;
      width: 100%;
      max-width: 320px;
    }
    #status-title { font-size: 1.5rem; font-weight: bold; margin-bottom: 8px; }
    #status-detail { font-size: 0.9rem; opacity: 0.9; }

    /* 映像プレビュー */
    .video-container {
      position: relative;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid rgba(255, 255, 255, 0.5);
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* 鏡像表示 */
    }

    /* 設定エリア */
    footer {
      background: rgba(0, 0, 0, 0.6);
      padding: 20px;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .slider-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      font-size: 0.85rem;
    }
    .slider-group label { display: flex; justify-content: space-between; width: 100%; }
    input[type="range"] { width: 100%; }

    button {
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: white;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>歩きスマホ自動検知システム</h1>
  </header>

  <main>
    <div class="video-container">
      <video id="webcam" autoplay playsinline muted></video>
    </div>

    <div id="status-card">
      <div id="status-title">🌱 安全な状態です</div>
      <div id="status-detail">歩行または視線を判定中...</div>
    </div>
  </main>

  <footer>
    <button id="start-btn">センサー・カメラを開始</button>

    <div class="slider-group">
      <label>
        <span>カメラ判定閾値（下向き角度）:</span>
        <span id="cam-val">15</span>
      </label>
      <input type="range" id="cam-threshold" min="5" max="40" value="15">
    </div>

    <div class="slider-group">
      <label>
        <span>加速度センサー閾値（歩行揺れ）:</span>
        <span id="motion-val">3.0</span>
      </label>
      <input type="range" id="motion-threshold" min="1.0" max="10.0" step="0.5" value="3.0">
    </div>
  </footer>

  <script>
    let isLookingDown = false;
    let isWalking = false;
    let audioCtx = null;
    let lastAccel = { y: 0, z: 0 };
    let lastWalkingTime = 0; // 最後に歩行（揺れ）を検知した時刻を保存する変数

    const body = document.body;
    const video = document.getElementById('webcam');
    const statusTitle = document.getElementById('status-title');
    const statusDetail = document.getElementById('status-detail');
    const startBtn = document.getElementById('start-btn');

    const camThresholdInput = document.getElementById('cam-threshold');
    const motionThresholdInput = document.getElementById('motion-threshold');
    const camValDisplay = document.getElementById('cam-val');
    const motionValDisplay = document.getElementById('motion-val');

    camThresholdInput.addEventListener('input', (e) => camValDisplay.textContent = e.target.value);
    motionThresholdInput.addEventListener('input', (e) => motionValDisplay.textContent = e.target.value);

    // --- 1. アプリ起動イベント ---
    startBtn.addEventListener('click', async () => {
      // Web Audio APIの初期化（ユーザー操作が必要）
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      // カメラの開始
      await initCamera();

      // Motion Sensor（iOS等の許可設定対応）
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        const permission = await DeviceMotionEvent.requestPermission();
        if (permission === 'granted') {
          window.addEventListener('devicemotion', handleMotion);
        }
      } else {
        window.addEventListener('devicemotion', handleMotion);
      }

      startBtn.style.display = 'none';
    });

    // --- 2. カメラ認識機能 (簡易明るさ・明暗差判定から角度を模倣) ---
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: false
        });
        video.srcObject = stream;
        
        // 簡易認識ロジック（画素解析ループ）
        setInterval(analyzeFrame, 200);
      } catch (err) {
        alert('カメラのアクセスが拒否されたか、対応していません。');
      }
    }

    function analyzeFrame() {
      if (!video.videoWidth) return;
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);

      // 上部と下部の明るさ差から「顔が下を向いたことでカメラの写り込みが変わったか」を簡易判定
      const topData = ctx.getImageData(0, 0, canvas.width, canvas.height / 2).data;
      const bottomData = ctx.getImageData(0, canvas.height / 2, canvas.width, canvas.height / 2).data;

      let topBrightness = 0, bottomBrightness = 0;
      for (let i = 0; i < topData.length; i += 16) topBrightness += topData[i];
      for (let i = 0; i < bottomData.length; i += 16) bottomBrightness += bottomData[i];

      const diff = Math.abs((topBrightness - bottomBrightness) / (topData.length / 16));
      const threshold = parseFloat(camThresholdInput.value);

      // 閾値を超えた場合に下向きと判定（プロトタイプ用ロジック）
      isLookingDown = diff > threshold;
      updateState();
    }

    // --- 3. 修正版の加速度センサー処理（余韻タイマー付き） ---
    function handleMotion(event) {
      const accel = event.accelerationIncludingGravity;
      if (!accel) return;

      const deltaY = Math.abs(accel.y - lastAccel.y);
      const deltaZ = Math.abs(accel.z - lastAccel.z);
      lastAccel = { y: accel.y, z: accel.z };

      const totalDelta = deltaY + deltaZ;
      const threshold = parseFloat(motionThresholdInput.value);
      const now = Date.now();

      // 1. 閾値を超える揺れがあったら「最後の歩行時刻」を更新
      if (totalDelta > threshold) {
        lastWalkingTime = now;
      }

      // 2. 最後に歩行を検知してから「2000ミリ秒（2秒）」以内なら、歩行中（余韻あり）と判定する！
      const delayTime = 2000; // ここで余韻の長さを調整できます（ミリ秒）
      isWalking = (now - lastWalkingTime) < delayTime;

      updateState();
    }

    // --- 4. 判定と警告発生機能 ---
    function updateState() {
      if (isLookingDown && isWalking) {
        // 【危険状態】
        body.className = 'danger';
        statusTitle.textContent = '⚠️ 危険！歩きスマホです！';
        statusDetail.textContent = '下を向きながら歩行しています！';

        playAlertSound();
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      } else {
        // 【安全状態】
        body.className = '';
        statusTitle.textContent = '🌱 安全な状態です';
        
        if (isWalking && !isLookingDown) {
          statusDetail.textContent = '前を向いて歩いています';
        } else if (!isWalking && isLookingDown) {
          statusDetail.textContent = '立ち止まって操作しています';
        } else {
          statusDetail.textContent = '周囲の安全が確保されています';
        }
      }
    }

    // 警告音再生（Web Audio API）
    let lastSoundTime = 0;
    function playAlertSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      if (now - lastSoundTime < 0.5) return; // 連打防止
      lastSoundTime = now;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(880, now); // A5 (ラ)
      gain.gain.setValueAtTime(0.1, now);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.3);
    }
  </script>
</body>
</html>
