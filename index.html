<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歩きPC防止システム</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #212529;
            --status-bg: #e9ecef;
            --status-color: #495057;
            --primary-color: #0d6efd;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s ease;
        }

        /* 危険検知時の背景変化（視覚的にも警告） */
        body.is-danger {
            background-color: #fff5f5;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 1.25rem;
            margin: 0 0 0.5rem 0;
            font-weight: 600;
        }

        p.desc {
            font-size: 0.875rem;
            color: #6c757d;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .status-badge {
            background-color: var(--status-bg);
            color: var(--status-color);
            padding: 0.75rem 1rem;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 2rem;
            display: inline-block;
            transition: all 0.3s ease;
        }

        /* 状態ごとのスタイル */
        .status-badge.active { background-color: #e7f5ff; color: #1c7ed6; }
        .status-badge.danger { background-color: #ffe3e3; color: #e03131; }

        .btn {
            width: 100%;
            padding: 0.875rem;
            font-size: 1rem;
            font-weight: 600;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn.stop {
            background-color: #6c757d;
        }

        /* カメラとキャンバスは非表示でバックグラウンド処理 */
        #video, #canvas { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon" id="icon">💻</div>
        <h1>歩きPC検知見守り</h1>
        <p class="desc">画面を開いたままの移動を検知し<br>安全な利用をサポートします</p>

        <div id="status" class="status-badge">停止中</div>

        <button id="toggleBtn" class="btn" onclick="toggleDetection()">監視をスタート</button>
    </div>

    <video id="video" width="320" height="240" autoplay playsinline></video>
    <canvas id="canvas" width="320" height="240"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');
        const toggleBtn = document.getElementById('toggleBtn');
        const iconDiv = document.getElementById('icon');

        let audioCtx = null;
        let lastFrameData = null;
        let isRunning = false;
        let intervalId = null;

        function playAlarm() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let osc = audioCtx.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime); 
            osc.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        async function toggleDetection() {
            if (!isRunning) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = stream;
                    isRunning = true;
                    
                    toggleBtn.innerText = "監視を停止";
                    toggleBtn.classList.add('stop');
                    statusDiv.innerText = "安全に監視中";
                    statusDiv.className = "status-badge active";
                    
                    intervalId = setInterval(checkMovement, 200);
                } catch (err) {
                    alert("カメラの起動に失敗しました。設定を確認してください。");
                    console.error(err);
                }
            } else {
                // 停止処理
                isRunning = false;
                clearInterval(intervalId);
                if (video.srcObject) {
                    video.srcObject.getTracks().forEach(track => track.stop());
                }
                toggleBtn.innerText = "監視をスタート";
                toggleBtn.classList.remove('stop');
                statusDiv.innerText = "停止中";
                statusDiv.className = "status-badge";
                document.body.classList.remove('is-danger');
                iconDiv.innerText = "💻";
            }
        }

        function checkMovement() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const currentFrame = ctx.getImageData(0, 0, canvas.width, canvas.height);
                
                if (lastFrameData) {
                    let diff = 0;
                    for (let i = 0; i < currentFrame.data.length; i += 4) {
                        diff += Math.abs(currentFrame.data[i] - lastFrameData.data[i]);
                    }
                    
                    if (diff > 1500000) { 
                        statusDiv.innerText = "⚠️ 歩行を検知しました";
                        statusDiv.className = "status-badge danger";
                        document.body.classList.add('is-danger');
                        iconDiv.innerText = "🚨";
                        playAlarm();
                    } else {
                        statusDiv.innerText = "安全（静止状態）";
                        statusDiv.className = "status-badge active";
                        document.body.classList.remove('is-danger');
                        iconDiv.innerText = "🛡️";
                    }
                }
                lastFrameData = currentFrame;
            }
        }
    </script>
</body>
</html>
